<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clasificación de madurez</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17231d;
      background: #f3f6f2;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    header {
      padding: 2.5rem 1.25rem;
      color: white;
      background: linear-gradient(120deg, #155d3b, #27845b);
    }

    header > div, main { width: min(940px, 100% - 2rem); margin: 0 auto; }
    h1 { margin: 0 0 .45rem; font-size: clamp(1.7rem, 5vw, 2.4rem); }
    header p { margin: 0; color: #e0f0e5; }
    main { padding: 1.5rem 0 3rem; display: grid; gap: 1rem; }

    section {
      padding: 1.25rem;
      border: 1px solid #dfe7df;
      border-radius: 14px;
      background: white;
      box-shadow: 0 4px 16px #163b2410;
    }

    h2 { margin: 0 0 1rem; font-size: 1.2rem; }
    label { display: block; margin: .75rem 0 .35rem; font-weight: 600; }
    input[type="file"], select, textarea {
      width: 100%;
      padding: .7rem;
      border: 1px solid #cbd6cc;
      border-radius: 8px;
      background: white;
      font: inherit;
    }

    textarea { min-height: 5rem; resize: vertical; }
    .inline { display: flex; align-items: center; gap: .55rem; margin: 1rem 0; }
    .inline label { margin: 0; font-weight: 500; }
    button {
      padding: .7rem 1rem;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #17613e;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { background: #104c30; }
    button:disabled { opacity: .6; cursor: wait; }
    .secondary { color: #155d3b; background: #e6f2e9; }
    .secondary:hover { background: #d7eadc; }
    .message { min-height: 1.4rem; margin: .75rem 0 0; }
    .error { color: #a32323; }
    .success { color: #17613e; }
    .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: .6rem 1rem; }
    .result-grid p { margin: .25rem 0; overflow-wrap: anywhere; }
    .prediction { color: #155d3b; font-size: 1.35rem; font-weight: 750; }
    .probability { margin: .85rem 0; }
    .probability-heading { display: flex; justify-content: space-between; margin-bottom: .3rem; }
    .bar { height: 10px; overflow: hidden; border-radius: 999px; background: #e8eee9; }
    .bar span { display: block; height: 100%; background: #35a66d; }
    .alert { padding: .7rem .85rem; margin-top: .65rem; border-radius: 8px; background: #fff3d4; color: #664d00; }
    .alert.danger { background: #fde7e7; color: #8c2020; }
    .gradcam { display: block; max-width: 100%; width: 224px; margin-top: 1rem; border-radius: 8px; }
    pre { overflow: auto; padding: 1rem; border-radius: 8px; background: #f2f5f2; white-space: pre-wrap; }
    [hidden] { display: none !important; }

    @media (min-width: 700px) {
      main { grid-template-columns: 1fr 1fr; align-items: start; }
      .wide { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Clasificación de madurez</h1>
      <p>Analiza una imagen y registra correcciones para mejorar el sistema.</p>
    </div>
  </header>

  <main>
    <section>
      <h2>Analizar imagen</h2>
      <form id="predict-form">
        <label for="image-file">Imagen de fruta o vegetal</label>
        <input id="image-file" name="file" type="file" accept="image/*" required>
        <div class="inline">
          <input id="include-gradcam" type="checkbox" checked>
          <label for="include-gradcam">Incluir visualización Grad-CAM</label>
        </div>
        <button id="predict-button" type="submit">Predecir</button>
      </form>
      <p id="predict-message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section id="prediction-result" hidden>
      <h2>Resultado</h2>
      <p id="predicted-class" class="prediction"></p>
      <div class="result-grid">
        <p>Confianza: <strong id="confidence"></strong></p>
        <p>Latencia: <strong id="latency"></strong></p>
        <p>ID de predicción: <strong id="prediction-id"></strong></p>
      </div>
      <h3>Probabilidades</h3>
      <div id="probabilities"></div>
      <div id="alerts"></div>
      <img id="gradcam-image" class="gradcam" alt="Visualización Grad-CAM" hidden>
    </section>

    <section>
      <h2>Retroalimentación del usuario</h2>
      <form id="feedback-form">
        <label for="real-label">Etiqueta real</label>
        <select id="real-label" required>
          <option value="madura">madura</option>
          <option value="podrida">podrida</option>
          <option value="verde">verde</option>
        </select>
        <label for="comment">Comentario (opcional)</label>
        <textarea id="comment" maxlength="1000" placeholder="Observaciones sobre la predicción"></textarea>
        <button id="feedback-button" type="submit">Enviar retroalimentación</button>
      </form>
      <p id="feedback-message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section>
      <h2>Métricas del servicio</h2>
      <button id="metrics-button" class="secondary" type="button">Consultar métricas</button>
      <pre id="metrics-output" aria-live="polite">Pulsa el botón para consultar las métricas.</pre>
    </section>
  </main>

  <script>
    const predictionForm = document.querySelector("#predict-form");
    const predictionButton = document.querySelector("#predict-button");
    const predictionMessage = document.querySelector("#predict-message");
    const predictionResult = document.querySelector("#prediction-result");
    let currentPredictionId = null;

    function showMessage(element, message, isError = false) {
      element.textContent = message;
      element.className = `message ${isError ? "error" : "success"}`;
    }

    predictionForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = document.querySelector("#image-file").files[0];
      if (!file) {
        showMessage(predictionMessage, "Selecciona una imagen.", true);
        return;
      }

      const formData = new FormData();
      formData.append("file", file);
      const includeGradcam = document.querySelector("#include-gradcam").checked;
      predictionButton.disabled = true;
      showMessage(predictionMessage, "Procesando imagen...");

      try {
        const response = await fetch(`/predict?include_gradcam=${includeGradcam}`, {
          method: "POST",
          body: formData
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.detail || "No se pudo procesar la imagen.");
        }

        currentPredictionId = result.prediction_id;
        predictionResult.hidden = false;
        document.querySelector("#predicted-class").textContent = result.clase_predicha;
        document.querySelector("#confidence").textContent =
          `${(result.confianza * 100).toFixed(1)}%`;
        document.querySelector("#latency").textContent =
          `${Number(result.latency_ms).toFixed(1)} ms`;
        document.querySelector("#prediction-id").textContent = currentPredictionId;

        const probabilities = document.querySelector("#probabilities");
        probabilities.replaceChildren();
        Object.entries(result.probabilidades).forEach(([name, value]) => {
          const percentage = Math.max(0, Math.min(100, Number(value) * 100));
          const row = document.createElement("div");
          row.className = "probability";
          const heading = document.createElement("div");
          heading.className = "probability-heading";
          const label = document.createElement("strong");
          label.textContent = name;
          const amount = document.createElement("span");
          amount.textContent = `${percentage.toFixed(1)}%`;
          const bar = document.createElement("div");
          bar.className = "bar";
          const fill = document.createElement("span");
          fill.style.width = `${percentage}%`;
          bar.append(fill);
          heading.append(label, amount);
          row.append(heading, bar);
          probabilities.append(row);
        });

        const alerts = document.querySelector("#alerts");
        alerts.replaceChildren();
        if (result.baja_confianza) {
          const alert = document.createElement("div");
          alert.className = "alert danger";
          alert.textContent = "La predicción tiene baja confianza.";
          alerts.append(alert);
        }
        if (result.drift?.drift_detected) {
          const alert = document.createElement("div");
          alert.className = "alert";
          alert.textContent = `Posible drift: ${(result.drift.reasons || []).join(", ") || "cambio detectado"}`;
          alerts.append(alert);
        }

        const gradcam = document.querySelector("#gradcam-image");
        if (result.gradcam_base64) {
          gradcam.src = result.gradcam_base64.startsWith("data:")
            ? result.gradcam_base64
            : `data:image/png;base64,${result.gradcam_base64}`;
          gradcam.hidden = false;
        } else {
          gradcam.removeAttribute("src");
          gradcam.hidden = true;
        }
        showMessage(predictionMessage, "Predicción completada.");
      } catch (error) {
        showMessage(predictionMessage, error.message, true);
      } finally {
        predictionButton.disabled = false;
      }
    });

    document.querySelector("#feedback-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.querySelector("#feedback-message");
      if (!currentPredictionId) {
        showMessage(message, "Primero realiza una predicción.", true);
        return;
      }

      const button = document.querySelector("#feedback-button");
      button.disabled = true;
      try {
        const response = await fetch("/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prediction_id: currentPredictionId,
            etiqueta_real: document.querySelector("#real-label").value,
            comentario: document.querySelector("#comment").value || null
          })
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.detail || "No se pudo guardar la retroalimentación.");
        }
        showMessage(message, `Retroalimentación guardada. Total: ${result.total_feedbacks}.`);
      } catch (error) {
        showMessage(message, error.message, true);
      } finally {
        button.disabled = false;
      }
    });

    document.querySelector("#metrics-button").addEventListener("click", async () => {
      const output = document.querySelector("#metrics-output");
      output.textContent = "Consultando...";
      try {
        const response = await fetch("/metrics");
        const metrics = await response.json();
        if (!response.ok) {
          throw new Error(metrics.detail || "No se pudieron consultar las métricas.");
        }
        const agreement = metrics.feedback_agreement_rate;
        output.textContent = [
          `Predicciones: ${metrics.total_predictions}`,
          `Latencia promedio: ${Number(metrics.avg_latency_ms).toFixed(1)} ms`,
          `Confianza promedio: ${(Number(metrics.avg_confidence) * 100).toFixed(1)}%`,
          `Eventos de drift: ${metrics.drift_events_count}`,
          `Acuerdo en feedback: ${agreement == null ? "Sin datos" : `${(agreement * 100).toFixed(1)}%`}`
        ].join("\n");
      } catch (error) {
        output.textContent = error.message;
      }
    });
  </script>
</body>
</html>
